services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/real_estate
      PORT: 4000
    depends_on:
      - db
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/client/node_modules

volumes:
  postgres_data:
